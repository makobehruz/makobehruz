<svg fill="none" viewBox="0 0 800 100" width="800" height="100" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes gradientText {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }
        @keyframes glow {
          0% { text-shadow: 0 0 5px #00f260, 0 0 10px #0575e6; }
          50% { text-shadow: 0 0 20px #00f260, 0 0 30px #0575e6; }
          100% { text-shadow: 0 0 5px #00f260, 0 0 10px #0575e6; }
        }
        h1 {
          font-family: 'Inter', sans-serif;
          margin: 0;
          font-size: 4em;
          font-weight: 900;
          letter-spacing: 0.15em;
          text-align: center;
          text-transform: uppercase;
          background: linear-gradient(270deg, #00f260, #0575e6, #00f260, #0575e6);
          background-size: 400%;
          background-clip: text;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: gradientText 3s ease infinite, glow 2s ease-in-out infinite;
        }
      </style>
      <h1>M A K O</h1>
    </div>
  </foreignObject>
</svg>
